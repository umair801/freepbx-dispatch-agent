; docker/asterisk-conf/ari.conf
;
; Enables Asterisk's REST Interface and creates the API user our ARI client
; (core/ari_client.py) authenticates as. Username/password here must match
; ASTERISK_ARI_USERNAME / ASTERISK_ARI_SECRET in .env.

[general]
enabled = yes
pretty = yes
allowed_origins = *

[agai33]
type = user
read_only = no
password = changeme_ari_secret
