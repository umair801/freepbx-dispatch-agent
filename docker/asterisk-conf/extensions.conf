; docker/asterisk-conf/extensions.conf
;
; Minimal dialplan routing any inbound call into AgAI-33's ARI Stasis app.
; app_name in the Stasis() line must match ASTERISK_ARI_APP_NAME in .env
; (default: agai33_dispatch). A softphone (Zoiper, MicroSIP) registered
; against the SIP config below and dialing any extension will land here.

[default]
exten => _X.,1,NoOp(AgAI-33 dispatch call incoming)
 same => n,Stasis(agai33_dispatch)
 same => n,Hangup()
