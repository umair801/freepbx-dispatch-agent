; docker/asterisk-conf/pjsip.conf
;
; Minimal PJSIP config so a softphone (Zoiper, MicroSIP, Linphone) can
; register against this local Asterisk instance and place a test call that
; lands in the [default] context above. Not representative of a real SIP
; trunk configuration -- this is purely for placing test calls into the
; Stasis app during local development.

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[testphone]
type = endpoint
context = default
disallow = all
allow = ulaw
auth = testphone-auth
aors = testphone-aor

[testphone-auth]
type = auth
auth_type = userpass
username = testphone
password = changeme_sip_secret

[testphone-aor]
type = aor
max_contacts = 1
